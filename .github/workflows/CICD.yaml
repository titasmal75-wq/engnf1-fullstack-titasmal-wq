name: Fullstack AWS EC2 Image-Based CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1                    # AWS region for your ECR & EC2 (e.g. us-east-1, ap-south-1)
  ECR_REPOSITORY: triagesync-app           # Amazon ECR repository name
  CONTAINER_NAME: triagesync-app           # Name of running container on EC2
  CONTAINER_PORT: 5000                     # Internal container port
  HOST_PORT: 5000                          # Public/host port on EC2

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Backend CI & Validation
  # ----------------------------------------------------------------------------
  backend-ci:
    name: Backend Test & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package*.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm install

      - name: Run Backend Tests & Integrity Checks
        working-directory: backend
        run: npm test

  # ----------------------------------------------------------------------------
  # Job 2: Frontend CI & Production Build
  # ----------------------------------------------------------------------------
  frontend-ci:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package*.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Run Frontend Lint
        working-directory: frontend
        run: npm run lint

      - name: Build Production Frontend
        working-directory: frontend
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 5

  # ----------------------------------------------------------------------------
  # Job 3: Build & Push Image to ECR, Then Deploy to AWS EC2 via SSH
  # ----------------------------------------------------------------------------
  deploy-ec2:
    name: Build, Push to ECR & Deploy to EC2
    needs: [backend-ci, frontend-ci]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 1: Authenticate with AWS using IAM credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Step 2: Log in to Amazon Elastic Container Registry (ECR)
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Step 3: Build multi-stage Docker image, tag with SHA and latest, then push to ECR
      - name: Build, Tag, and Push Image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building Docker image from ./dockerfile..."
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            -f ./dockerfile .

          echo "Pushing Docker image tags to Amazon ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

          echo "registry=$ECR_REGISTRY" >> $GITHUB_OUTPUT

      # Step 4: SSH into AWS EC2 Instance, pull new ECR image, and run container
      - name: Deploy to AWS EC2 Instance via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY,IMAGE_TAG
          script: |
            echo "=== 1. Authenticating EC2 Docker daemon with Amazon ECR ==="
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin $ECR_REGISTRY

            echo "=== 2. Pulling latest application image from ECR ==="
            docker pull $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest

            echo "=== 3. Stopping and removing old container (if exists) ==="
            docker stop ${{ env.CONTAINER_NAME }} || true
            docker rm ${{ env.CONTAINER_NAME }} || true

            echo "=== 4. Starting new container from updated image ==="
            docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              --restart unless-stopped \
              -p 80:5000 \
              -p 5000:5000 \
              -e PORT=5000 \
              -e NODE_ENV=production \
              -e MONGODB_URI="${{ secrets.MONGODB_URI }}" \
              -e JWT_ACCESS_SECRET="${{ secrets.JWT_ACCESS_SECRET }}" \
              -e JWT_REFRESH_SECRET="${{ secrets.JWT_REFRESH_SECRET }}" \
              -e ACCESS_TOKEN_EXPIRES="${{ secrets.ACCESS_TOKEN_EXPIRES || '15m' }}" \
              -e REFRESH_TOKEN_EXPIRES="${{ secrets.REFRESH_TOKEN_EXPIRES || '7d' }}" \
              $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:latest

            echo "=== 5. Cleaning up stale/dangling images ==="
            docker image prune -f

            echo "=== 6. Verifying container health on EC2 ==="
            sleep 4
            docker ps --filter "name=${{ env.CONTAINER_NAME }}"
            echo "Deployment to AWS EC2 completed successfully!"
