version: "3.8"

services:

  app:
    build:
      context: .
      dockerfile: dockerfile
    container_name: triagesync-app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/triagesync
      - JWT_ACCESS_SECRET=local_jwt_access_secret_key_12345
      - JWT_REFRESH_SECRET=local_jwt_refresh_secret_key_12345
      - ACCESS_TOKEN_EXPIRES=15m
      - REFRESH_TOKEN_EXPIRES=7d
    depends_on:
      - mongodb
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    container_name: triagesync-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
